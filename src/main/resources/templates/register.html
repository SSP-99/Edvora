<!-- src/main/resources/templates/register.html -->
<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head th:replace="~{layout :: head('Register')}"></head>
<body class="bg-light">
    <div th:replace="~{layout :: navbar}"></div>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-dark text-white text-center py-3">
                        <h4 class="mb-0">Create New Account</h4>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/register}" th:object="${registerDto}" method="post">
                            <div class="mb-3">
                                <label for="fullName" class="form-label">Full Name</label>
                                <input type="text" id="fullName" th:field="*{fullName}" class="form-control" th:errorclass="is-invalid" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email Address</label>
                                <input type="email" id="email" th:field="*{email}" class="form-control" th:errorclass="is-invalid" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" id="password" th:field="*{password}" class="form-control" th:errorclass="is-invalid" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2">Create Account</button>
                        </form>
                    </div>
                    <div class="card-footer text-center bg-transparent border-0">
                        <p class="text-muted small">Already registered? <a th:href="@{/login}">Login instead</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
