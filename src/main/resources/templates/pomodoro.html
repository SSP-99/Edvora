<!-- src/main/resources/templates/pomodoro.html -->
<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edvora - Pomodoro Timer</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
    <div th:replace="~{layout :: navbar}"></div>

    <div class="container my-5 text-center">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm border-0 p-5 p-md-5">
                    <h2 class="fw-bold mb-3 text-dark">Focus Engine</h2>
                    <div id="timerMode" class="fs-4 fw-semibold text-primary mb-4">Focus Time</div>
                    
                    <div class="pomodoro-display mb-4" id="timerDisplay">25:00</div>
                    
                    <div class="d-flex justify-content-center gap-3 mb-4">
                        <button id="startPauseBtn" class="btn btn-lg btn-primary px-4 fw-bold">Start</button>
                        <button id="resetBtn" class="btn btn-lg btn-outline-secondary px-4">Reset</button>
                    </div>

                    <div class="border-top pt-4">
                        <div class="text-muted fs-6">
                            Completed Cycles This Session: <span id="cycleCount" class="fw-bold text-dark fs-5">0</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/js/pomodoro.js}"></script>
    <script src="https://jsdelivr.net"></script>
</body>
</html>
