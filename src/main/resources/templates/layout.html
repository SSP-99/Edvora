<!-- src/main/resources/templates/layout.html -->
<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" xmlns:sec="http://thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Edvora</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <script src="https://jsdelivr.net" defer></script>
    <script src="https://jsdelivr.net" defer></script>
</head>
<body>
    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" th:href="@{/}">Edvora</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navRes">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navRes">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0" sec:authorize="isAuthenticated()">
                    <li class="nav-item"><a class="nav-link" th:href="@{/}">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/subjects}">Subjects</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/exams}">Exams</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/timetable}">Timetable</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/analytics}">Analytics</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/pomodoro}">Pomodoro</a></li>
                </ul>
                <div class="d-flex align-items-center" sec:authorize="isAuthenticated()">
                    <span class="navbar-text me-3 text-light" th:text="${#authentication.name}">User</span>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button class="btn btn-outline-danger btn-sm" type="submit">Logout</button>
                    </form>
                </div>
                <div class="navbar-nav ms-auto" sec:authorize="isAnonymous()">
                    <a class="nav-link" th:href="@{/login}">Login</a>
                    <a class="nav-link" th:href="@{/register}">Register</a>
                </div>
            </div>
        </div>
    </nav>
</body>
</html>
