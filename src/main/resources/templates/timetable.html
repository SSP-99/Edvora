<!-- src/main/resources/templates/timetable.html -->
<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edvora - Timetable</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
    <div th:replace="~{layout :: navbar}"></div>

    <div class="container my-5">
        <div class="row g-4">
            <div class="col-md-4">
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-body">
                        <h5 class="card-title fw-bold text-primary mb-3">View Date</h5>
                        <form method="get" th:action="@{/timetable}" class="d-flex gap-2">
                            <input type="date" name="date" th:value="${date}" class="form-control" required>
                            <button type="submit" class="btn btn-primary">Go</button>
                        </form>
                    </div>
                </div>

                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-body">
                        <h5 class="card-title fw-bold text-success mb-3">Generate Timetable</h5>
                        <form method="post" th:action="@{/timetable/generate}">
                            <div class="mb-3">
                                <label class="form-label small fw-bold">From Date</label>
                                <input type="date" name="from" th:value="${from != null ? from : date}" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-bold">To Date</label>
                                <input type="date" name="to" th:value="${to}" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Generate / Regenerate</button>
                        </form>
                    </div>
                </div>

                <div class="card shadow-sm border-0">
                    <div class="card-body d-flex flex-column gap-2">
                        <form method="post" th:action="@{/timetable/reschedule}">
                            <button type="submit" class="btn btn-warning w-100 text-dark fw-bold">Reschedule Missed Sessions</button>
                        </form>
                        <a th:href="@{/timetable/export(from=${from != null ? from : date}, to=${to})}" class="btn btn-outline-secondary w-100">Export Timetable to CSV</a>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white border-0 py-3 d-flex justify-content-between align-items-center">
                        <h4 class="mb-0 fw-bold text-dark">Schedule for <span class="text-primary" th:text="${date}">2026-10-14</span></h4>
                    </div>
                    <div class="card-body p-0">
                        <div th:if="${#lists.isEmpty(sessions)}" class="p-5 text-center text-muted">
                            No study sessions scheduled for this day. Generate a new timetable or pick another date.
                        </div>
                        <div th:if="${!#lists.isEmpty(sessions)}" class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Topic</th>
                                        <th>Type</th>
                                        <th>Planned</th>
                                        <th>Actual</th>
                                        <th>Status</th>
                                        <th class="text-end">Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="session : ${sessions}">
                                        <td>
                                            <div class="fw-bold text-dark" th:text="${session.topic.title}">Topic Title</div>
                                            <small class="text-muted" th:text="${session.topic.subject.name}">Subject</small>
                                        </td>
                                        <td>
                                            <span th:if="${session.type.name() == 'STUDY'}" class="badge bg-info text-dark">Study</span>
                                            <span th:if="${session.type.name() == 'REVISION'}" class="badge bg-purple text-white">Revision</span>
                                        </td>
                                        <td th:text="${session.plannedMinutes + ' mins'}">45 mins</td>
                                        <td th:text="${session.status.name() == 'DONE' ? session.actualMinutes + ' mins' : '-'}">-</td>
                                        <td>
                                            <span th:if="${session.status.name() == 'PLANNED'}" class="badge bg-secondary">Planned</span>
                                            <span th:if="${session.status.name() == 'DONE'}" class="badge bg-success">Done</span>
                                            <span th:if="${session.status.name() == 'MISSED'}" class="badge bg-danger">Missed</span>
                                        </td>
                                        <td class="text-end">
                                            <form th:if="${session.status.name() == 'PLANNED'}" method="post" th:action="@{/timetable/done/{id}(id=${session.id})}" class="d-flex align-items-center justify-content-end gap-2">
                                                <input type="number" name="actualMinutes" class="form-control form-control-sm" style="width: 80px;" placeholder="Mins" min="1" required>
                                                <button type="submit" class="btn btn-sm btn-success">Complete</button>
                                            </form>
                                            <span th:if="${session.status.name() != 'PLANNED'}" class="text-muted small">-</span>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://jsdelivr.net"></script>
</body>
</html>
